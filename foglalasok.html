<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalások – GB Burger</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Saját CSS (a Bootstrap UTÁN, hogy felül tudja írni) -->
    <link rel="stylesheet" href="./css/foglalasok.css">

    <script src="./js/kozos.js" defer></script>
    <script src="./js/foglalasok.js" defer></script>
</head>
<body>

    <!-- Navigáció: ugyanez kerüljön mindegyik oldalra, csak az "active" vándorol -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">GB Burger</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Főoldal</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Rólunk</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="foglalasok.html">Foglalások</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="mb-4">Foglalások</h1>

        <!-- Vezérlősáv: szűrés, rendezés, nézetváltás -->
        <div class="row g-3 align-items-end mb-4">
            <div class="col-md-3">
                <label for="kereses" class="form-label">Keresés névre</label>
                <input type="search" id="kereses" class="form-control" placeholder="pl. Kovács">
            </div>

            <div class="col-md-3">
                <label for="szuresDatum" class="form-label">Szűrés dátumra</label>
                <input type="date" id="szuresDatum" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="rendezesMezo" class="form-label">Rendezés</label>
                <div class="input-group">
                    <!-- A value-k = a JSON kulcsnevei, így foglalas[mezo] alakban lehet rájuk hivatkozni -->
                    <select id="rendezesMezo" class="form-select">
                        <option value="nev">Név</option>
                        <option value="datum">Dátum</option>
                        <option value="vendegszam">Vendégszám</option>
                        <option value="vegosszeg">Végösszeg</option>
                    </select>
                    <button type="button" id="rendezesGomb" class="btn btn-primary">Rendezés ↑</button>
                </div>
            </div>

            <div class="col-md-2">
                <div class="btn-group w-100" role="group" aria-label="Nézetváltó">
                    <button type="button" id="tablazatGomb" class="btn btn-outline-secondary active">Táblázat</button>
                    <button type="button" id="kartyaGomb" class="btn btn-outline-secondary">Kártya</button>
                </div>
            </div>
        </div>

        <!-- Visszajelzések (pl. törlés után) ide kerülnek -->
        <div id="uzenet"></div>

        <!-- Ide generálja a JS a táblázatot vagy a kártyákat -->
        <div id="kiiras"></div>
    </main>

    <!-- Vissza a tetejére gomb (a megjelenítését Geri kozos.js-e kezeli) -->
    <button type="button" id="felGomb" class="btn btn-primary" aria-label="Vissza a tetejére">↑</button>

    <!-- Bootstrap JS (a navbar lenyitásához kell) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
